<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMT Timesheets</title>
<link rel="stylesheet" href="../styles.css?v=timesheet-nav-clean-20260626">
<link rel="stylesheet" href="../portal.css?v=timesheet-nav-clean-20260626">
<script src="../config.js"></script>
<script defer src="../portal/auth.js?v=entra-auth-20260715-2"></script>
</head>
<body>
<header class="app-header">
<div class="brand-block"><img src="../image.png" alt="GMT Electrical Services Ltd logo" class="site-logo"><div><p class="eyebrow">93-95 Gloucester Rd, Croydon CR0 2DN</p><h1>Timesheets</h1><p>Create or analyse timesheets.</p></div></div>
<nav class="header-actions"><a href="../portal/">Staff Portal</a><a href="../jobs/">Job Cards</a><a href="../tools/">Tools</a></nav>
</header>
<main class="app-main" hidden>
<section class="portal-card-grid">
<a class="portal-feature-card" href="create.html"><span>Create Timesheet</span><small>Open the weekly timesheet form.</small></a>
<a class="portal-feature-card" href="../audit/index.html"><span>Analyse Sheet/s</span><small>Open the audit checker.</small></a>
<form class="portal-feature-card clock-card" data-clock-form data-default-action="clock_in">
<div class="clock-card-heading"><span data-clock-title>Clock In</span><small data-clock-description>Record an arrival time and send it to accounts.</small></div>
<label>Full name<input name="employee_name" autocomplete="name" required placeholder="Your name"></label>
<input name="clock_action" type="hidden" value="clock_in">
<fieldset class="clock-actions" aria-label="What are you recording?">
<legend>Record</legend>
<button type="button" data-clock-action="clock_in" aria-pressed="true">Clock in</button>
<button type="button" data-clock-action="lunch_start" aria-pressed="false">Lunch start</button>
<button type="button" data-clock-action="lunch_end" aria-pressed="false">Lunch end</button>
<button type="button" data-clock-action="clock_out" aria-pressed="false">Clock out</button>
<button type="button" data-clock-action="absent" aria-pressed="false">Absent</button>
<button type="button" class="clock-full-day-button" data-clock-action="full_day" aria-pressed="false" aria-label="Fill out a whole day" title="Fill out a whole day">+</button>
</fieldset>
<label>Date<input name="clock_date" type="date" required></label>
<label data-clock-time-field>Time<input name="clock_time" type="time" required></label>
<label data-absence-field hidden>Absence reason<select name="absence_reason" disabled><option value="Sick">Sick</option><option value="Holiday">Holiday</option><option value="Time Off">Time Off</option><option value="Other">Other</option></select></label>
<section class="clock-full-day" data-full-day-fields hidden aria-label="Full day details">
<p>Whole day details</p>
<div class="clock-full-day-grid">
<label>Start<input name="day_start" type="time" disabled></label>
<label>Lunch start<input name="day_lunch_start" type="time" disabled></label>
<label>Lunch end<input name="day_lunch_end" type="time" disabled></label>
<label>Finish<input name="day_finish" type="time" disabled></label>
</div>
</section>
<details class="clock-note-details">
<summary>Add a note (optional)</summary>
<label>Note<textarea name="clock_note" rows="3" placeholder="Add a note for accounts, if needed."></textarea></label>
</details>
<button type="submit" data-clock-submit>Submit clock in</button>
<p class="small-text clock-status" aria-live="polite"></p>
</form>
</section>
</main>
<script src="../lazy-xlsx.js"></script>
<script src="../timesheet-clock.js?v=09afe64-profile"></script>
</body>
</html>
