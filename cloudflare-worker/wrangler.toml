name = "gmt-portal-api"
main = "src/index.js"
compatibility_date = "2026-09-10"

# Check hourly and dispatch only during the configured local filing window.
# Cloudflare cron expressions are UTC; the Worker converts the scheduled time
# to Europe/London so the window remains stable across daylight-saving changes.
[triggers]
crons = ["0 * * * *"]

# Replace the database_id after creating the GMT portal D1 database in the
# Cloudflare account. Runtime values are configured as Worker variables/secrets.
[[d1_databases]]
binding = "DB"
database_name = "gmt-portal"
database_id = "911701fb-bad4-4615-a715-98f92b41144c"
migrations_dir = "migrations"

[vars]
ENTRA_TENANT_ID = "8b182d6b-6f34-4ca2-84ad-50ca712b5488"
ENTRA_AUDIENCES = "01b5a6c6-f6c1-47cb-aebe-67f07f415e4b,https://service.flow.microsoft.com/"
ALLOWED_ORIGINS = "https://gmt-services.co.uk,https://www.gmt-services.co.uk,https://gmt-timesheets.pages.dev"
ADMIN_UPNS = "acc.gmtelect@outlook.com,acc.gmtelect@gmt-services.co.uk"
OPERATIONS_ADMIN_UPNS = "info@gmt-services.co.uk"
JOB_CARD_ADMIN_UPNS = "acc.gmtelect@outlook.com,acc.gmtelect@gmt-services.co.uk,info@gmt-services.co.uk"
ADMIN_OIDS = ""
ADMIN_GROUP_IDS = ""
HISTORY_UPSTREAM_URL = "https://b7db48c95976ef8e943878dfe20987.42.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/e25c8f033575417ea40c1ef91d2c852b/triggers/manual/paths/invoke?api-version=1"
# The Accounts completion view uses this approved portal roster to distinguish
# a missing submission from an employee who has never submitted a record.
STAFF_DIRECTORY_JSON = '[{"name":"Jason","upn":"jason@gmt-services.co.uk"},{"name":"Matthew","upn":"matthew@gmt-services.co.uk"},{"name":"Ainsley","upn":"ainsley@gmt-services.co.uk"},{"name":"Simon","upn":"simon@gmt-services.co.uk"},{"name":"Faith","upn":"faith.b@gmt-services.co.uk"},{"name":"Michelle","upn":"michelle@gmt-services.co.uk"}]'
DISPATCH_ENABLED = "true"
DISPATCH_WEEKDAY = "Friday"
DISPATCH_HOUR = "18"
DISPATCH_TIMEZONE = "Europe/London"
XERO_SCOPES = "openid profile email offline_access accounting.invoices.read"
XERO_AUTH_URL = "https://login.xero.com/identity/connect/authorize"
XERO_TOKEN_URL = "https://identity.xero.com/connect/token"
XERO_API_URL = "https://api.xero.com"
XERO_REDIRECT_URI = "https://gmt-portal-api.raspy-breeze-e230.workers.dev/api/xero/callback"
XERO_POST_CONNECT_REDIRECT = "https://gmt-services.co.uk/jobs/?xero=connected"
