<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My completed timesheets | GMT Staff Portal</title>
<link rel="stylesheet" href="../styles.css?v=timesheet-history-20260909">
<link rel="stylesheet" href="../portal.css?v=timesheet-history-20260909">
<script src="../config.js?v=entra-oidc-fallback-20260912"></script>
<script defer src="../analytics.js?v=umami-20260819"></script>
<script defer src="auth.js?v=entra-auth-20260912-oidc-worker"></script>
</head>
<body>
<header class="app-header portal-header">
  <div class="brand-block">
    <img src="../image.webp" alt="GMT Electrical Services Ltd logo" class="site-logo" width="1536" height="1024">
    <div><p class="eyebrow">GMT Staff Portal</p><h1>My completed timesheets</h1><p class="portal-header-subtitle">Your completed records and corrections</p></div>
  </div>
  <nav class="header-actions" aria-label="Timesheet navigation"><a href="index.html">Dashboard</a><span class="portal-identity-name" data-portal-identity-name hidden></span><button type="button" id="portal-sign-out" hidden>Sign out</button></nav>
</header>
<main class="app-main" hidden>
  <section class="card portal-history-card" aria-labelledby="history-title">
    <p class="portal-card-kicker">Identity-filtered history</p>
    <h2 id="history-title">My completed timesheets</h2>
    <div class="portal-history-toolbar">
      <p id="timesheet-history-status" class="small-text" role="status">Loading your records…</p>
      <label class="portal-history-filter">Show
        <select id="portal-history-filter" aria-label="Filter my submissions">
          <option value="all" selected>All submissions</option>
          <option value="timesheets">Weekly timesheets</option>
          <option value="clock">Clock in and breaks</option>
          <option value="job-cards">Job cards</option>
          <option value="estimates">Estimates</option>
          <option value="calendar">Calendar requests</option>
          <option value="tasks">Tasks</option>
        </select>
      </label>
      <button type="button" id="timesheet-history-refresh" class="secondary">Refresh</button>
    </div>
    <p id="timesheet-history-link" class="small-text" hidden></p>
    <iframe id="portal-history-frame" class="portal-history-frame" title="Protected GMT submission history" src="history-frame.html?filter=all" loading="lazy" referrerpolicy="same-origin"></iframe>
    <div class="portal-history-actions"><a class="button button-link portal-primary-link" href="../timesheets/">Create or edit</a></div>
  </section>
</main>
<script defer src="timesheets.js?v=history-frame-20260910"></script>
</body>
</html>
